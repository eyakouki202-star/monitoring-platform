apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntopng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ntopng
  template:
    metadata:
      labels:
        app: ntopng
    spec:
      containers:
      - name: ntopng
        image: eyakouki/monitoring-ntopng:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ntopng
spec:
  type: NodePort
  selector:
    app: ntopng
  ports:
  - port: 3000
    targetPort: 3000
